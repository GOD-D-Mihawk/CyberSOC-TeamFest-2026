<!doctype html><html lang="en"><head><meta charset="utf-8"><script>
(function(){
const p=location.pathname;
const suffix=location.search+location.hash;
if(p.replace(/\/$/,'').toLowerCase()==='/hughes.adm')
  location.replace('/admin.html'+suffix);
else {
  sessionStorage.setItem('tf_path',p);
  location.replace('/'+suffix);
}
})();
</script></head><body>Redirecting to TeamFest...</body></html>
